allowBuilds:
  '@firebase/util': true
  core-js: true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@sentry/browser-utils@10.75.1'
  - '@sentry/browser@10.75.1'
  - '@sentry/core@10.75.1'
  - '@sentry/feedback@10.75.1'
  - '@sentry/react@10.75.1'
  - '@sentry/replay-canvas@10.75.1'
  - '@sentry/replay@10.75.1'

# Same as package.json's pnpm.overrides (older pnpm reads that, pnpm 10+ reads
# this) - keep them identical so every pnpm resolves the same patched versions.
overrides:
  dompurify: '>=3.4.16'
  '@grpc/grpc-js': '>=1.13.6'
